# Grafana: Deployment (sin estado propio: TODO llega por provisioning desde ConfigMaps).
# Si el pod se borra, el Deployment crea otro idéntico que vuelve a cargar fuente, tablero y alertas.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: { app: grafana }
spec:
  type: NodePort                  # acceso desde el anfitrión: http://localhost:30300
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: 3000, nodePort: 30300 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  strategy: { type: RollingUpdate }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext: { fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana-oss:11.2.0
          ports: [{ containerPort: 3000, name: http }]
          envFrom:
            - configMapRef: { name: solarbi-config }     # umbrales de alerta y host de la base
          env:
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: { secretKeyRef: { name: solarbi-secret, key: GF_SECURITY_ADMIN_USER } }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: solarbi-secret, key: GF_SECURITY_ADMIN_PASSWORD } }
            - name: GRAFANA_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: solarbi-secret, key: GRAFANA_DB_PASSWORD } }
          volumeMounts:
            - { name: estado, mountPath: /var/lib/grafana }
            - { name: ds, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: proveedor, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: alertas, mountPath: /etc/grafana/provisioning/alerting, readOnly: true }
            - { name: tableros, mountPath: /var/lib/grafana/dashboards, readOnly: true }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - { name: estado, emptyDir: {} }
        - { name: ds, configMap: { name: grafana-datasources } }
        - { name: proveedor, configMap: { name: grafana-proveedor } }
        - { name: alertas, configMap: { name: grafana-alertas } }
        - { name: tableros, configMap: { name: grafana-tableros } }
